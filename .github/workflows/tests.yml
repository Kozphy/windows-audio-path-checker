name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Packaging sanity
        run: |
          python -c "import audio_path_checker; print(audio_path_checker.__file__)"
          python -c "from importlib.metadata import distribution; names=distribution('windows-audio-path-checker').read_text('top_level.txt'); assert 'audio_path_checker' in names; assert 'artifacts' not in names.split()"
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q audio_path_checker

