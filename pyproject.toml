[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "windows-audio-path-checker"
version = "0.6.0"
description = "Evidence-driven Windows audio/Bluetooth path diagnostics with root-cause inference, timelines, SQLite history, and safe remediation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zixsa" }]
keywords = ["windows", "audio", "headphones", "diagnostics", "wasapi", "reliability", "observability", "incident", "sqlite"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
  "numpy>=1.26",
  "psutil>=5.9",
  "pycaw>=20240210; platform_system == 'Windows'",
  "sounddevice>=0.5",
]

[project.gui-scripts]
windows-audio-checker = "audio_path_checker.gui:main"

[project.scripts]
windows-audio-checker-cli = "audio_path_checker.__main__:main"

[project.urls]
Homepage = "https://github.com/Kozphy/windows-audio-path-checker"
Issues = "https://github.com/Kozphy/windows-audio-path-checker/issues"

[tool.setuptools]
include-package-data = true

# Flat-layout auto-discovery would treat runtime output dir artifacts/ as a package.
[tool.setuptools.packages.find]
where = ["."]
include = ["audio_path_checker*"]
exclude = [
  "artifacts*",
  "tests*",
]

[tool.setuptools.package-data]
audio_path_checker = ["browser_test.html"]
